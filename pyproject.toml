[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gitfetch"
version = "3.0.0rc1"
description = "Neofetch-style CLI profiles for GitHub, GitLab, Bitbucket, Gitea, Forgejo and Codeberg"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND LicenseRef-DejaVu"
license-files = ["LICENSE", "gitfetch/assets/fonts/LICENSE-DejaVu.txt", "gitfetch/assets/language-icons/LICENSE-devicon.txt"]
dependencies = [
    "requests>=2.34.2,<3.0.0",
    "urllib3>=2.8.0,<3.0.0",
    "certifi>=2026.10.23",
    "idna>=3.20,<4.0.0",
    "Pillow>=13.0.0,<14.0.0",
    "wcwidth>=0.9.3,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Retain established datetime spellings; the support-floor change does not
# require unrelated provider/date formatting edits. These are style rules.
extend-ignore = ["UP017", "FURB162"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"

[project.urls]
Homepage = "https://github.com/gongahkia/gitfetch"
Documentation = "https://github.com/gongahkia/gitfetch"
Repository = "https://github.com/gongahkia/gitfetch"

[project.scripts]
gitfetch = "gitfetch.main:main"

[tool.setuptools.packages.find]
include = ["gitfetch*"]

[tool.setuptools.package-data]
gitfetch = ["assets/language-icons/*.png", "assets/language-icons/LICENSE-devicon.txt", "assets/fonts/*.ttf", "assets/fonts/LICENSE-DejaVu.txt"]
